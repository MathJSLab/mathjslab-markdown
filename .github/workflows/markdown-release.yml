name: Markdown release validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Reuse a validated candidate artifact from this workflow run
        required: false
        type: string
      package_only:
        description: Validate the package without rebuilding the host application
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: markdown-release-validation
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      MARKDOWN_BROWSER_PROJECTS: all
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: actions/checkout@v4
        if: ${{ !inputs.package_only }}
        with:
          repository: MathJSLab/mathjslab-app
          ref: a667d8a5aa63a5d065a72ba47af2237323a9b4b3
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse validated candidate
        if: ${{ inputs.candidate_run }}
        uses: actions/download-artifact@v4
        with:
          name: markdown-release-linux-1
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: .
      - name: Install package dependencies and browsers
        if: ${{ !inputs.candidate_run || inputs.package_only }}
        working-directory: package
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium firefox webkit
      - name: Restore built distribution for focused revalidation
        if: ${{ inputs.candidate_run && inputs.package_only }}
        working-directory: package
        run: tar -xzf mathjslab-markdown-0.8.3.tgz --strip-components=1
      - name: Validate and build package sequentially
        if: ${{ !inputs.candidate_run }}
        working-directory: package
        run: |
          npm run verify:hdl:release
          npm run test:unit -- --runTestsByPath test/markdown/ExampleReferences.spec.ts
          npm run build
          npm run verify:package
          npm pack --ignore-scripts
      - name: Check focused settled fragment navigation in all engines
        if: ${{ !inputs.candidate_run }}
        working-directory: package
        env:
          MARKDOWN_FRAGMENT_SCENARIOS: document
          MARKDOWN_FRAGMENT_MOTION: no-preference
        run: npm run test:browser:fragments
      - name: Check actual example references loaded by URL
        if: ${{ !inputs.candidate_run }}
        working-directory: package
        run: npm run test:browser:example-references
      - name: Check molecular rendering with native and absent OffscreenCanvas
        if: ${{ !inputs.candidate_run || inputs.package_only }}
        working-directory: package
        env:
          MARKDOWN_MOLECULE_HEADED: firefox
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a npm run test:browser:molecules
      - name: Install candidate into isolated application
        if: ${{ !inputs.package_only }}
        working-directory: app
        run: |
          npm ci --ignore-scripts
          mkdir -p vendor
          cp ../package/mathjslab-markdown-0.8.3.tgz vendor/
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const archive='mathjslab-markdown-0.8.3.tgz'; fs.writeFileSync('vendor/markdown-local.json', JSON.stringify({archive, sha256:crypto.createHash('sha256').update(fs.readFileSync('vendor/'+archive)).digest('hex')}));"
          npm install --ignore-scripts --save-exact ./vendor/mathjslab-markdown-0.8.3.tgz
          npx playwright install --with-deps chromium firefox webkit
      - name: Validate and build application sequentially
        if: ${{ !inputs.package_only }}
        working-directory: app
        run: |
          npm run build:eleventy
          npm run build:assets
          npm run build:test-browser
      - name: Repeat Firefox image security tests without retries
        if: ${{ !inputs.package_only }}
        working-directory: app
        run: npx playwright test test/browser/markdown-security.spec.ts --project=firefox --workers=1 --retries=0 --repeat-each=3
      - name: Check application heading references in all engines
        if: ${{ !inputs.package_only }}
        working-directory: app
        run: npx playwright test test/browser/markdown-heading-references.spec.ts --workers=1 --retries=0
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-release-linux-${{ github.run_attempt }}
          path: |
            package/report
            package/mathjslab-markdown-0.8.3.tgz
            app/report
            app/playwright-report
            app/test/result/playwright
          retention-days: 7
